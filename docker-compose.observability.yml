# docker-compose.observability.yml
# -----------------------------------
# Stack opcional de observabilidade: Prometheus + Grafana
# Sprint 9B.4
#
# Uso (adicionado ao compose principal):
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
#
# Acesso após inicialização:
#   Prometheus: http://localhost:9090
#   Grafana:    http://localhost:3001  (admin / admin — alterar em produção)
#
# O backend já expõe métricas em http://backend:8000/metrics
# quando PROMETHEUS_ENABLED=true (padrão).

services:

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: inspection-ai-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"     # mantém 15 dias de métricas
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - inspection-network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout:  10s
      retries:  3

  grafana:
    image: grafana/grafana:11.1.0
    container_name: inspection-ai-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER:     admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}   # ⚠️ alterar em produção
      GF_USERS_ALLOW_SIGN_UP:     "false"
      GF_SERVER_ROOT_URL:         http://localhost:3001
      # Desabilita telemetria para ambiente industrial (sem saída para internet)
      GF_ANALYTICS_REPORTING_ENABLED:       "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES:       "false"
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - inspection-network
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/health | grep ok"]
      interval: 30s
      timeout:  10s
      retries:  3

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  inspection-network:
    external: true
